<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboards Lactalis - BTL Latino</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1n9bD3nXaotF1G21LYdfSTpQqgCStXaxg">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Estilo de la pantalla de bloqueo */
        #login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .login-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .login-logos img {
            max-height: 45px;
            object-fit: contain;
        }

        #login-container h2 {
            margin-bottom: 10px;
            color: #333;
            font-size: 22px;
        }

        #login-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        #login-container button {
            width: 100%;
            padding: 12px;
            background-color: #0078d4;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #login-container button:hover {
            background-color: #005a9e;
        }

        #error-msg {
            color: #d83b01;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }

        /* Estilo del contenedor principal del sitio */
        #dashboard-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
        }

        header {
            background-color: #252423;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logos {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logos img {
            max-height: 35px;
            object-fit: contain;
        }

        /* Botones de pestañas superiores */
        .header-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .tab-btn:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        /* Estilo para la pestaña activa */
        .tab-btn.active {
            background-color: #0078d4;
            border-color: #0078d4;
            font-weight: 600;
        }

        header button.logout-btn {
            background-color: transparent;
            border: 1px solid white;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        header button.logout-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Contenido de las secciones */
        .content-section {
            display: none;
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        .content-section.active {
            display: flex;
        }

        .content-section iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Acceso -->
    <div id="login-container">
        <div class="login-logos">
            <img src="https://lh3.googleusercontent.com/d/1n9bD3nXaotF1G21LYdfSTpQqgCStXaxg" alt="Logo BTL">
            <img src="https://lh3.googleusercontent.com/d/1GbPvi7et3lJsACaLpjfW2lnS5oPOV8B0" alt="Logo Cliente">
        </div>
        <h2>Acceso Restringido</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Introduce tu código de acceso para visualizar el panel.</p>
        <input type="password" id="access-code" placeholder="Código de acceso">
        <button onclick="verificarCodigo()">Entrar</button>
        <div id="error-msg">Código incorrecto. Inténtalo de nuevo.</div>
    </div>

    <!-- Contenedor Principal (Oculto inicialmente) -->
    <div id="dashboard-container">
        <header>
            <div class="header-left">
                <div class="header-logos">
                    <img src="https://lh3.googleusercontent.com/d/1n9bD3nXaotF1G21LYdfSTpQqgCStXaxg" alt="Logo BTL">
                    <img src="https://lh3.googleusercontent.com/d/1GbPvi7et3lJsACaLpjfW2lnS5oPOV8B0" alt="Logo Cliente">
                </div>
                
                <!-- PESTAÑAS DE NAVEGACIÓN INTERNA -->
                <div class="header-tabs">
                    <button class="tab-btn active" onclick="cambiarPestana('powerbiDB', this)">📊 Panel de Control - Nacional</button>
                    <button class="tab-btn" onclick="cambiarPestana('powerbiTP', this)">📊 Tienda Perfecta</button>
                </div>
            </div>

            <button class="logout-btn" onclick="cerrarSesion()">Salir</button>
        </header>

        <!-- SECCIÓN 1: POWER BI DB (Activa por defecto) -->
        <div id="seccion-powerbiDB" class="content-section active">
            <iframe title="ReportePowerBI-DB" src="https://app.powerbi.com/view?r=eyJrIjoiNDFhMTA0NWEtODg0Ny00YjhjLWIwNDYtNDVlNTA4ZGZjYTRjIiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" allowFullScreen="true"></iframe>
        </div>

        <!-- SECCIÓN 2: POWER BI TP (Oculta por defecto) -->
        <div id="seccion-powerbiTP" class="content-section">
            <iframe title="ReportePowerBI-TP" src="https://app.powerbi.com/view?r=eyJrIjoiMzc0MTNjNzQtNmQ2NS00YzRlLWFjYjUtMjIyN2I5Mjg0ZDhiIiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" allowFullScreen="true"></iframe>
        </div>
    </div>

    <script>
        const CLAVES_VALIDAS = ["LACTALISBTL-NACIONAL", "2864", "BTL2026"]; 

        function verificarCodigo() {
            const inputVal = document.getElementById("access-code").value.trim();
            const errorMsg = document.getElementById("error-msg");

            if (CLAVES_VALIDAS.includes(inputVal)) {
                document.getElementById("login-container").style.display = "none";
                document.getElementById("dashboard-container").style.display = "flex";
                errorMsg.style.display = "none";
            } else {
                errorMsg.style.display = "block";
            }
        }

        document.getElementById("access-code").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verificarCodigo();
            }
        });

        function cambiarPestana(seccion, boton) {
            document.querySelectorAll('.content-section').forEach(sec => {
                sec.classList.remove('active');
            });

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            if (seccion === 'powerbiDB') {
                document.getElementById('seccion-powerbiDB').classList.add('active');
            } else if (seccion === 'powerbiTP') {
                document.getElementById('seccion-powerbiTP').classList.add('active');
            }

            boton.classList.add('active');
        }

        function cerrarSesion() {
            document.getElementById("dashboard-container").style.display = "none";
            document.getElementById("login-container").style.display = "block";
            document.getElementById("access-code").value = "";
            cambiarPestana('powerbiDB', document.querySelector('.tab-btn'));
        }
    </script>

</body>
</html>
